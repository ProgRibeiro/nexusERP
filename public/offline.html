<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1833" />
    <title>NX ERP · Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at 50% 0, #173676 0, #0b1833 42%, #061025 100%);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 460px); text-align: center; }
      .brand {
        display: inline-grid;
        height: 72px;
        width: 72px;
        place-items: center;
        border: 1px solid rgba(147, 197, 253, .25);
        border-radius: 22px;
        background: rgba(37, 99, 235, .22);
        box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
        font-size: 27px;
        font-weight: 900;
      }
      h1 { margin: 24px 0 10px; font-size: clamp(24px, 7vw, 34px); line-height: 1.1; }
      p { margin: 0 auto; max-width: 380px; color: #bfdbfe; font-size: 15px; line-height: 1.65; }
      .note {
        margin-top: 24px;
        padding: 14px 16px;
        border: 1px solid rgba(148, 163, 184, .18);
        border-radius: 16px;
        background: rgba(15, 23, 42, .48);
        color: #cbd5e1;
        font-size: 12px;
      }
      button {
        min-height: 46px;
        margin-top: 22px;
        padding: 0 22px;
        border: 0;
        border-radius: 13px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">NX</div>
      <h1>Você está sem conexão</h1>
      <p>O NX ERP precisa alcançar o servidor para carregar dados atualizados. Verifique o Wi-Fi ou a internet e tente novamente.</p>
      <div class="note">Rascunhos e evidências salvos no modo de campo permanecem protegidos neste aparelho e serão sincronizados quando a conexão voltar.</div>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
