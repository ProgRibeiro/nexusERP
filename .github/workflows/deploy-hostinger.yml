name: Deploy Hostinger VPS

on:
  workflow_dispatch:
  push:
    branches:
      - agent/erp-beta-linux

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_prestacao_servicos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_prestacao_servicos?schema=public
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      INTEGRATION_ENCRYPTION_KEY: ci-integration-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run security:audit
      - run: npm run test:rls
      - run: npm run test:integration
      - run: npm run build

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            APP_ROOT="${APP_ROOT:-/var/www/nexus-erp}"
            REPO_DIR="${REPO_DIR:-$APP_ROOT/repo}"
            cd "$REPO_DIR"
            BRANCH="${DEPLOY_BRANCH:-agent/erp-beta-linux}"
            APP_DOMAIN="${APP_DOMAIN:-erp.seudominio.com.br}"
            APP_BASE_URL="${APP_BASE_URL:-https://$APP_DOMAIN}"
            export APP_ROOT REPO_DIR BRANCH APP_DOMAIN APP_BASE_URL
            bash deploy/hostinger/deploy-hostinger-bluegreen.sh
