# Configuração Nginx Reverse Proxy para Nexus ERP (nexusmanutencao.com)

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexusmanutencao.com www.nexusmanutencao.com;

    # Limite de Upload de pelo menos 50 MB
    client_max_body_size 50M;

    access_log /var/log/nginx/nexus-erp.access.log;
    error_log /var/log/nginx/nexus-erp.error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Suporte a WebSockets (ex: SignalR ou Blazor Server)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Repasse de cabeçalhos de rede originais
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts adequados para rotas e relatórios do ERP
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
