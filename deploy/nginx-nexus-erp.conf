include /etc/nginx/nexus-erp-upstream.conf;

limit_req_zone $binary_remote_addr zone=nexus_general:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=nexus_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __NEXUS_DOMAIN__ __NEXUS_WWW_DOMAIN__ __NEXUS_APP_DOMAIN__ __NEXUS_COMMERCIAL_DOMAIN__ __NEXUS_DEV_DOMAIN__;
    server_tokens off;

    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    location = /api/auth/login {
        limit_req zone=nexus_login burst=3 nodelay;
        proxy_pass http://nexus_erp_backend;
    }

    # Chunks de todas as releases recentes permanecem disponíveis. Isso evita
    # erro em telas que já estavam abertas durante uma atualização blue/green.
    location ^~ /_next/static/ {
        alias /var/cache/nexus-erp/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=nexus_general burst=40 nodelay;
        proxy_pass http://nexus_erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location = /api/health {
        proxy_pass http://nexus_erp_backend;
        access_log off;
    }
}
